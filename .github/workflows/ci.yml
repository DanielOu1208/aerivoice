name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Confirm toolchain
        run: xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild \
            -project AeriVoice.xcodeproj \
            -scheme AeriVoice \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            test

      - name: Run static analysis
        run: |
          xcodebuild \
            -project AeriVoice.xcodeproj \
            -scheme AeriVoice \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            analyze

      - name: Validate release tooling
        run: |
          bash -n scripts/release-local.sh
          python3 -m unittest discover -s scripts/tests -v

      - name: Build Release
        run: |
          xcodebuild \
            -project AeriVoice.xcodeproj \
            -scheme AeriVoice \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/aerivoice-release-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate branded DMG
        run: |
          python3 -m venv "$RUNNER_TEMP/aerivoice-dmg-tools"
          dmg_python="$RUNNER_TEMP/aerivoice-dmg-tools/bin/python"
          "$dmg_python" -m pip install --require-hashes --only-binary=:all: -r scripts/dmg/requirements.txt
          "$dmg_python" scripts/build-dmg.py build \
            --app "$RUNNER_TEMP/aerivoice-release-build/AeriVoice.app" \
            --output "$RUNNER_TEMP/AeriVoice-preview.dmg"
          "$dmg_python" scripts/test-dmg-layout.py \
            --app "$RUNNER_TEMP/aerivoice-release-build/AeriVoice.app" \
            --dmg "$RUNNER_TEMP/AeriVoice-preview.dmg"

      - name: Check local evaluation scenarios and model records
        run: |
          xcodebuild \
            -project AeriVoice.xcodeproj \
            -scheme AeriVoiceEvalHarness \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/aerivoice-eval-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          python3 scripts/test-local-eval.py "$RUNNER_TEMP/aerivoice-eval-build/AeriVoiceEvalHarness" -v
          python3 scripts/test-apple-eval.py "$RUNNER_TEMP/aerivoice-eval-build/AeriVoiceEvalHarness" -v
          python3 scripts/test-local-model-provenance.py -v
